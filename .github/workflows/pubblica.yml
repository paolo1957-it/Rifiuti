name: Pubblica sito e aggiorna punti di raccolta

on:
  push:
    branches: [main]
  schedule:
    # ogni giorno (ora UTC): mattina, mezzogiorno e pomeriggio
    - cron: "23 5 * * *"
    - cron: "23 11 * * *"
    - cron: "23 16 * * *"
  workflow_dispatch:         # pulsante "Run workflow" per farlo partire a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scarica i punti di raccolta da OpenStreetMap
        timeout-minutes: 45
        env:
          SITO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python aggiorna_rifiuti.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v5
